<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c60"><title>LZtimer · Competition</title><link rel="stylesheet" href="competition.css"><script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script><script src="storage.js"></script><script type="module" src="competition.mjs"></script><link rel="stylesheet" href="settings.css"><script src="settings-core.js"></script><script src="settings.js"></script></head><body>
<div id="edgeFlash" aria-hidden="true"></div>
<header class="focus-hide"><a class="brand" href="./" id="brandLink"><span class="brand-icon">◇</span>LZtimer<span class="brand-dot">.</span></a><nav aria-label="Timer mode"><a href="./" id="dailyLink">Practice</a><span aria-current="page">Competition</span></nav><span class="header-note"><span class="status-dot"></span> Shortcuts disabled</span><button class="settings-trigger" data-open-settings title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.7 2.4-2 .9-2.3-.6-2 3.5 1.7 1.8v2.2L2 15l2 3.5 2.3-.6 2 .9L9 21h4l.7-2.2 2-.9 2.3.6 2-3.5-1.7-1.8V11L20 9.2l-2-3.5-2.3.6-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg></button></header>
<div class="workspace"><aside class="focus-hide"><section class="panel round-panel"><div class="section-head"><h2>Round</h2><span id="roundBadge" class="badge">5 solves</span></div><ol id="roundSolves" class="solve-slots"></ol><div class="round-predictions"><div><span class="micro" title="Best possible average">BPA</span><strong id="bestPossibleAverage">—</strong></div><div><span class="micro" title="Worst possible average">WPA</span><strong id="worstPossibleAverage">—</strong></div></div></section><section class="panel trend-panel"><div class="section-head"><h2>Statistics</h2><span class="micro" id="roundCount">0 rounds</span></div><div class="trend-chart"><canvas id="roundChart" aria-label="Round ao5 trend"></canvas><div id="chartEmpty" class="empty-chart">No completed rounds</div></div><div class="history-title micro">Completed rounds</div><div id="roundHistory" class="round-history"></div></section></aside>
<main><section class="toolbar focus-hide"><div class="event-field"><span class="micro">Event</span><select id="competitionEvent" aria-label="Event"></select></div><div class="round-controls"><button id="startRound" class="primary">Start round <span>↗</span></button><button id="abortRound" class="subtle" hidden>End round</button></div></section>
<section class="panel scramble-panel focus-hide"><span id="scrambleInfo" hidden></span><div id="competitionScramble" class="scramble-text">Select an event to begin</div></section>
<div class="stage" id="competitionStage"><div class="phase-label focus-hide"><span class="status-dot"></span><span id="phaseLabel">Ready</span></div><div id="competitionTimer" class="timer" role="timer" aria-label="Competition timer">0.00</div><div id="stageHint" class="stage-hint focus-hide"></div><div id="phaseProgress" class="phase-progress focus-hide"><span id="phaseProgressBar"></span></div><div id="inspectionPenalty" class="inspection-penalty focus-hide"></div><div id="resultActions" class="result-actions focus-hide" hidden><button id="editCompetitionResult">Edit time</button><button id="judgePlus2" title="Toggle additional +2">+2</button><button id="judgeDNF" title="Toggle DNF">DNF</button><button id="nextAttempt" class="primary">Next attempt →</button></div><button id="retryScramble" class="primary focus-hide" hidden>Retry scramble</button></div>
<div class="stage-footer focus-hide"><section class="panel diagram-panel"><div class="section-head"><span class="micro">Preview</span></div><div id="competitionDiagram" class="diagram"><span class="micro">No scramble</span></div></section></div>
</main></div><div id="notice" class="notice" role="status" hidden></div><dialog id="editCompetitionDialog" class="settings-modal" aria-labelledby="editCompetitionTitle"><div class="settings-head"><h2 id="editCompetitionTitle">Edit time</h2><button type="button" class="settings-close" id="closeCompetitionEdit" aria-label="Cancel">×</button></div><form id="editCompetitionForm" class="manual-form"><label for="editCompetitionValue">Time before penalty</label><input id="editCompetitionValue" class="manual-input" type="text" inputmode="decimal" maxlength="14" autocomplete="off" required aria-label="Time before penalty"><div id="editCompetitionPreview" class="manual-preview" aria-live="polite"></div><p id="editCompetitionError" class="manual-error" role="status"></p><div class="manual-actions"><button type="button" id="cancelCompetitionEdit">Cancel</button><button type="submit" id="saveCompetitionEdit">Save</button></div></form></dialog><script nomodule>A modern browser with JavaScript modules is required.</script></body></html>
